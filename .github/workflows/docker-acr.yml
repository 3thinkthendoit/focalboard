name: Docker Build & Push to ACR

# Build a multi-arch Focalboard image and push it to Alibaba Cloud ACR.
# Mirrors the rustfs docker.yml pattern:
#   - The full ACR image prefix is hardcoded below as REGISTRY_ACR
#     (registry + namespace + repo), same pattern as the rustfs docker.yml
#   - Only the ACR credentials come from GitHub secrets (ACR_USERNAME / ACR_PASSWORD)
#   - Manual trigger only (workflow_dispatch)

on:
  workflow_dispatch:

env:
  # 完整 ACR 镜像前缀（与 rustfs 同域名/命名空间，仅仓库名不同）
  REGISTRY_ACR: crpi-hzehwxn7bt1lszkb.cn-hangzhou.personal.cr.aliyuncs.com/3thinkthendoit/focalboard
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute version (git tag or short sha)
        id: meta
        run: |
          if git describe --abbrev=0 --tags >/dev/null 2>&1; then
            VERSION=$(git describe --abbrev=0 --tags)
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: crpi-hzehwxn7bt1lszkb.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.buildx
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY_ACR }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY_ACR }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          pull: true
