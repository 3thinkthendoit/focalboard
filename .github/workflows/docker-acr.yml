name: Docker Build & Push to ACR

# Build a multi-arch Focalboard image and push it to Alibaba Cloud ACR.
# Tags: <git short sha> and "latest".
#
# Required GitHub repository secrets:
#   ACR_REGISTRY   e.g. registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  e.g. your-namespace
#   ACR_USERNAME   ACR login account
#   ACR_PASSWORD   ACR login password

on:
  workflow_dispatch:

env:
  IMAGE_NAME: focalboard

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${SHORT_SHA} and :latest"
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.buildx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
